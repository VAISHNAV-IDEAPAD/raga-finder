name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build Release APK & AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ragafinder2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ragafinder' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ragafinder2026' }}
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee assemble.log || (echo "=== GRADLE ASSEMBLE RELEASE FAILED ===" && tail -n 250 assemble.log && exit 1)
          ./gradlew bundleRelease --no-daemon --stacktrace --info 2>&1 | tee bundle.log || (echo "=== GRADLE BUNDLE RELEASE FAILED ===" && tail -n 250 bundle.log && exit 1)

      - name: Upload Gradle Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            android/assemble.log
            android/bundle.log
            android/app/build/reports/
          retention-days: 7

      - name: Upload Signed APK (For Direct Phone Testing & Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: raga-finder-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Signed AAB (For Google Play Store Console Upload)
        uses: actions/upload-artifact@v4
        with:
          name: raga-finder-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
