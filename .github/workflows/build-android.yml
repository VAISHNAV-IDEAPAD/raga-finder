name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build Release APK & AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ragafinder2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ragafinder' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ragafinder2026' }}
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace
          echo "=== Release APK Output Directory ==="
          ls -la app/build/outputs/apk/release/ || true
          echo "=== Release Bundle Output Directory ==="
          ls -la app/build/outputs/bundle/release/ || true

      - name: Upload Signed APK (For Direct Phone Testing & Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: raga-finder-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed AAB (For Google Play Store Console Upload)
        uses: actions/upload-artifact@v4
        with:
          name: raga-finder-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (Direct 1-Click Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "Raga Finder Android Release v1.0"
          body: |
            ## 🎵 Raga Finder Android App (v1.0)
            
            ### 📱 Direct Downloads:
            - **Release APK** (Direct phone installation & testing): download below under Assets.
            - **Google Play AAB** (Google Play Store upload bundle): download below under Assets.
            
            ### 🔑 Production Keystore:
            - Package ID: `com.ragafinder.app`
            - Target SDK: 35 (Android 15)
            - Signing: RSA 2048-bit, valid until Feb 2054
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
