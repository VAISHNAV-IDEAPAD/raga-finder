name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release APK & AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ragafinder2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ragafinder' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ragafinder2026' }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Signed APK (For Direct Phone Testing & Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: raga-finder-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Signed AAB (For Google Play Store Console Upload)
        uses: actions/upload-artifact@v4
        with:
          name: raga-finder-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
