<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Raga Finder - Carnatic & Hindustani Musicology</title>
  <meta name="theme-color" content="#d97706">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1c1917 0%, #292524 50%, #451a03 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 32px rgba(217, 119, 6, 0.35);
      margin-bottom: 24px;
      position: relative;
    }
    .logo-icon {
      width: 52px;
      height: 52px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    h1 span {
      color: #fbbf24;
    }
    p {
      font-size: 13px;
      color: #d6d3d1;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .loader {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(251, 191, 36, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }
    .status-text {
      margin-top: 16px;
      font-size: 12px;
      font-weight: 600;
      color: #fbbf24;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg class="logo-icon" viewBox="0 0 24 24">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </div>
  <h1>Raga<span>Finder</span></h1>
  <p>Carnatic & Hindustani Musicology &bull; 908 Ragas &bull; Live Raga Radio</p>
  <div class="loader"></div>
  <div class="status-text" id="status">Loading Ragas...</div>

  <script>
    // If running in Capacitor with a live server URL configured, this shell will transition automatically
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const statusEl = document.getElementById('status');
        if (statusEl) statusEl.textContent = 'Starting Engine...';
      }, 1000);
    });
  </script>
</body>
</html>
